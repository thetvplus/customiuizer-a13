name: A13 Fast CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a13-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        run: bash tools/ci_install_android_sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.2
        with:
          cache-cleanup: on-success

      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: CI portability
        run: python tools/check_ci_portability.py

      - name: Text encoding gate
        run: python tools/check_text_encoding.py

      - name: Python tool tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Static governance checks
        run: |
          python tools/check-invariants.py
          python tools/check-compat-contracts.py
          python tools/check_hook_contract_parity.py
          python tools/source_hazard_scan.py
          python tools/catalog_contract_probe.py --catalog app/src/main/java/tv/withaibuild/customiuizer/mods/catalog/FeatureCatalog.kt --feature-id app/src/main/java/tv/withaibuild/customiuizer/mods/catalog/FeatureId.kt --diagnostic-ids app/src/main/java/tv/withaibuild/customiuizer/mods/diagnostics/DiagnosticIds.kt --matrix docs/rom-intelligence/A13_PROCESS_MATRIX.md
          python tools/ci_contract_scan.py --expected-branch main --default-branch main
          python tools/audit_hook_ownership.py --check

      - name: Full local verifier
        run: python tools/verify.py full
