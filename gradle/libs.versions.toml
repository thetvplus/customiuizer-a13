[versions]
agp = "9.5.0"
kotlin = "2.4.21"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
commons-lang3 = "3.22.0"
host-guava = "33.8.0-jre"
host-bouncycastle = "1.87"
host-httpclient = "4.5.14"
androidx-preference = "1.2.1"
androidx-palette = "1.1.0"
androidx-appcompat = "1.8.0"
junit = "4.13.2"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
host-guava = { module = "com.google.guava:guava", version.ref = "host-guava" }
host-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "host-bouncycastle" }
host-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "host-bouncycastle" }
host-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "host-bouncycastle" }
host-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "host-httpclient" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidx-preference" }
androidx-palette = { module = "androidx.palette:palette", version.ref = "androidx-palette" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
